# ==============================================================================
# Anime Jeopardy - Docker Compose for Raspberry Pi & Portainer
# ==============================================================================
# Multi-architecture: Works on Raspberry Pi (arm64 / armv7) and x86_64 PCs
#
# Quick Portainer Deployment:
# 1. Open Portainer -> Stacks -> Add stack
# 2. Name: "anime-jeopardy"
# 3. Paste this docker-compose content into the Web editor
# 4. Click "Deploy the stack"
# 5. Open http://<raspberry-pi-ip>:8080 in any browser or Smart TV
# ==============================================================================

services:
  anime-jeopardy:
    # Build from local Dockerfile when cloning the repo, OR pull image
    build:
      context: .
      dockerfile: Dockerfile
    image: anime-jeopardy:latest
    container_name: anime_jeopardy
    restart: unless-stopped
    ports:
      # Map host port 8080 to container port 80
      # Change "8080:80" to "80:80" if port 80 is free on your Raspberry Pi
      - "8080:80"
    volumes:
      # Bind mount for custom anime images:
      # Drop your pictures (.jpg, .png, .webp) into ./images on the Pi
      # and reference them as /images/your-picture.jpg in game-data.js
      - ./images:/usr/share/nginx/html/images:ro
    environment:
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
